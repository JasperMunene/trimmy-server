name: Deploy to Staging

on:
  push:
    branches: [sandbox]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/trimmy-staging
            git fetch origin sandbox
            git reset --hard origin/sandbox

            # The values from GitHub go to .env.deploy, then merge into the server's .env:
            # a secret/variable that's set replaces the value; one that's missing (empty)
            # keeps what .env already has; keys only in .env stay. So values kept on the
            # server by hand aren't wiped by a secret nobody added to GitHub.
            # Quoted delimiter: values are written literally, so a `$` in a
            # secret isn't expanded by the server's shell.
            cat > .env.deploy <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            REDIS_URL=redis://redis:6379/0
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}

            # SMS (HostPinnacle / Intacom) for phone OTP
            SMS_API_KEY=${{ secrets.SMS_API_KEY }}
            SMS_USER_ID=${{ secrets.SMS_USER_ID }}
            SMS_PASSWORD=${{ secrets.SMS_PASSWORD }}
            SMS_SENDER_ID=${{ secrets.SMS_SENDER_ID }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}

            # Google sign-in
            GOOGLE_AUTH_CLIENT_ID=${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
            GOOGLE_AUTH_CLIENT_SECRET=${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}
            GOOGLE_WEB_REDIRECT_URL=${{ vars.GOOGLE_WEB_REDIRECT_URL }}
            GOOGLE_MOBILE_REDIRECT_URL=${{ vars.GOOGLE_MOBILE_REDIRECT_URL }}

            # Cloudflare R2 (photo storage)
            R2_ENDPOINT=${{ vars.R2_ENDPOINT }}
            R2_BUCKET=${{ vars.R2_BUCKET }}
            R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}

            # M-Pesa (Daraja STK push with payment routing)
            MPESA_ENV=${{ vars.MPESA_ENV }}
            MPESA_SHORTCODE=${{ vars.MPESA_SHORTCODE }}
            MPESA_CALLBACK_URL=${{ vars.MPESA_CALLBACK_URL }}
            MPESA_CONSUMER_KEY=${{ secrets.MPESA_CONSUMER_KEY }}
            MPESA_CONSUMER_SECRET=${{ secrets.MPESA_CONSUMER_SECRET }}
            MPESA_PASSKEY=${{ secrets.MPESA_PASSKEY }}
            MPESA_CALLBACK_SECRET=${{ secrets.MPESA_CALLBACK_SECRET }}

            # Notifications
            EXPO_ACCESS_TOKEN=${{ secrets.EXPO_ACCESS_TOKEN }}
            NOTIFY_PUSH_ENABLED=${{ vars.NOTIFY_PUSH_ENABLED }}
            GOOGLE_WEB_REDIRECT_ALLOWLIST=${{ vars.GOOGLE_WEB_REDIRECT_ALLOWLIST }}
            EOF

            touch .env
            awk '
              FNR == NR {
                if (match($0, /^[A-Za-z_][A-Za-z0-9_]*=/)) {
                  k = substr($0, 1, RLENGTH - 1); old[k] = substr($0, RLENGTH + 1); keys[++n] = k
                }
                next
              }
              match($0, /^[A-Za-z_][A-Za-z0-9_]*=/) {
                k = substr($0, 1, RLENGTH - 1); v = substr($0, RLENGTH + 1)
                if (v == "" && (k in old)) v = old[k]
                print k "=" v; seen[k] = 1; next
              }
              { print }
              END { for (i = 1; i <= n; i++) if (!(keys[i] in seen)) print keys[i] "=" old[keys[i]] }
            ' .env .env.deploy > .env.new
            mv .env.new .env
            rm -f .env.deploy
            chmod 600 .env

            echo "=== Running migrations ==="
            docker compose -f docker-compose.staging.yml run --rm app alembic upgrade head

            echo "=== Building and starting containers ==="
            docker compose -f docker-compose.staging.yml down
            docker compose -f docker-compose.staging.yml up -d --build

            sleep 8
            docker compose -f docker-compose.staging.yml ps

            echo "=== Staging deploy complete ==="
            curl -s http://localhost:8001/health
