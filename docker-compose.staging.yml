x-app-env: &app-env
  # Everything else (DATABASE_URL, SECRET_KEY, Google, R2, M-Pesa, Resend, SMS, CORS_ORIGINS, ...)
  # comes from .env via `env_file` on each service. Only what has to differ inside the
  # containers, or has a sensible default, is set here: a key listed here wins over .env,
  # so a pass-through like ${VAR:-} would blank the .env value whenever it's unset.
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://timmy:${RABBITMQ_PASSWORD:-timmy_staging_password}@rabbitmq:5672/
  # ${VAR:-default} reads .env too (Compose interpolates from it), so these only fall back
  # to the default when .env leaves them empty.
  CLIENT_URL: ${CLIENT_URL:-https://api.sandbox.trimmy.com}
  # JSON list of exact web return URLs allowed for Google sign-in, e.g. ["https://app.trimmy.com/auth/google"]
  GOOGLE_WEB_REDIRECT_ALLOWLIST: ${GOOGLE_WEB_REDIRECT_ALLOWLIST:-[]}
  GOOGLE_MOBILE_REDIRECT_URL: ${GOOGLE_MOBILE_REDIRECT_URL:-trimmy://auth/google}
  MPESA_ENV: ${MPESA_ENV:-sandbox}
  # Push stays off until EAS/APNs/FCM are set up; tokens are collected meanwhile.
  NOTIFY_PUSH_ENABLED: ${NOTIFY_PUSH_ENABLED:-false}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: timmy
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-timmy_staging_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - default
      - pg-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python worker.py
    # Give in-flight tasks time to finish on redeploy (worker waits up to 30s).
    stop_grace_period: 40s
    # Tasks call module services, so the worker needs the same DB access as the API.
    networks:
      - default
      - pg-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Enqueues periodic tasks (e.g. releasing expired booking holds) for the
    # workers to run. Exactly one replica: don't scale this service.
    command: python worker.py --beat

volumes:
  redis_data:
  rabbitmq_data:

networks:
  default:
    name: trimmy-staging
  pg-net:
    external: true
    name: pg-server_db_network
